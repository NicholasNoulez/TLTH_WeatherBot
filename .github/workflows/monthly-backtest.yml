name: Monthly model backtest

on:
  schedule:
    - cron: "0 20 1 * *"   # 1st of the month, 03:00 Bangkok
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python festival_weather.py backtest --days 730
      - name: Save best model
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add state/best_model.json
          git diff --cached --quiet || (git commit -m "Update best weather model" && git pull --rebase && git push)
